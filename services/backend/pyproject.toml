[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-quant-backend"
version = "0.1.0"
description = "Flask API interface for the intelligent quantitative analysis platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "akshare>=1.18,<2.0",
  "Flask>=3.1,<4.0",
  "pandas>=2.3,<4.0",
]

[project.optional-dependencies]
dev = [
  "PyYAML>=6.0,<7.0",
  "pytest>=8.3,<9.0",
  "ruff>=0.8,<1.0",
]

[project.scripts]
quant-backend = "app.wsgi:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
