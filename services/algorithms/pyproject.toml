[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-quant-algorithms"
version = "0.1.0"
description = "AkShare and Pandas algorithm interfaces for the intelligent quantitative analysis platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "akshare>=1.18,<2.0",
  "pandas>=2.3,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q -m \"not network\""
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "network: tests that require live AkShare network calls",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
