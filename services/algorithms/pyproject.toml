[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-quant-algorithms"
version = "0.1.0"
description = "AkShare and Pandas algorithm interfaces for the intelligent quantitative analysis platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "akshare==1.18.94",
  "pandas>=2.3,<4.0",
  "requests>=2.32,<3.0",
]

[project.scripts]
quant-data-update = "quant_platform.cli:main"

[project.optional-dependencies]
notebooks = [
  "nbformat>=5.10,<6",
  "nbclient>=0.10,<1",
  "ipykernel>=6.29,<8",
  "jsonschema>=4.26,<5",
  "PyYAML>=6,<7",
]
dev = [
  "jsonschema>=4.26,<5",
  "PyYAML>=6,<7",
  "pytest>=8.3,<9.0",
  "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q -m \"not network\""
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "network: tests that require live AkShare network calls",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
