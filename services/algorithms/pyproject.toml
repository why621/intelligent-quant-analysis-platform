[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-quant-algorithms"
version = "0.1.0"
description = "AkShare and Pandas algorithm interfaces for the intelligent quantitative analysis platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "akshare==1.18.94",
  "pandas>=2.3,<4.0",
  "requests>=2.32,<3.0",
]

[project.scripts]
quant-data-update = "quant_platform.cli:main"
quant-rl-train = "quant_platform.rl.train:main"
quant-deep-history = "quant_platform.data.deep_history:main"

[project.optional-dependencies]
notebooks = [
  "nbformat>=5.10,<6",
  "nbclient>=0.10,<1",
  "ipykernel>=6.29,<8",
  "jsonschema>=4.26,<5",
  "PyYAML>=6,<7",
]
# Heavy single-agent RL stack. Intentionally kept OUT of [dev] so the default
# test-suite and CI never install torch. For CPU-only wheels install torch from
# the PyTorch CPU index first, then: pip install -e ".[rl]".
# Verified on Python 3.13.5 (repo .venv, D drive) with the Tsinghua mirror on
# 2026-09-19 — offline suite green, ruff clean:
#   torch==2.14.0+cpu  stable-baselines3==2.9.0  gymnasium==1.3.0
#   transitive: cloudpickle==3.1.2, farama-notifications==0.0.6, filelock==4.0.1,
#               fsspec==2026.9.0, mpmath==1.3.0, networkx==3.6.1, sympy==1.14.0
rl = [
  "stable-baselines3>=2.4,<3.0",
  "gymnasium>=1.0,<2.0",
  "torch>=2.4,<3.0",
]
dev = [
  "jsonschema>=4.26,<5",
  "PyYAML>=6,<7",
  "pytest>=8.3,<9.0",
  "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q -m \"not network\""
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "network: tests that require live AkShare network calls",
    "rl: tests that require the optional stable-baselines3/torch/gymnasium stack",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools.package-data]
"quant_platform.data" = ["calendar_closures.json"]
