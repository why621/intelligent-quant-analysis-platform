gzip on;
gzip_types application/javascript text/css;
gzip_min_length 1024;
gzip_vary on;
client_max_body_size 64k;
limit_conn clients 8;
limit_conn allclients 24;
limit_conn_status 429;
limit_req_status 429;
location = /api/backtests {
    if (-f /etc/nginx/conf.d/maintenance.enabled) { return 503; }
    error_page 503 = @publication_maintenance;
    limit_req zone=jobs burst=3 nodelay;
    limit_req zone=globaljobs burst=6 nodelay;
    include /etc/nginx/quant-proxy.conf;
}
location /api/ {
    limit_req zone=api burst=20 nodelay;
    include /etc/nginx/quant-proxy.conf;
}
location /.well-known/acme-challenge/ {
    root /var/www/acme;
    try_files $uri =404;
}
location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
}

location @publication_maintenance {
    default_type application/json;
    add_header Access-Control-Allow-Origin "https://why621.github.io" always;
    add_header Retry-After "120" always;
    return 503 '{"error":{"code":"DATA_NOT_READY","message":"数据批次切换中，请稍后提交；已有任务编号仍可查询。"}}';
}
