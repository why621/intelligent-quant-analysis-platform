server {
    listen 8443 ssl;
    server_name 43.161.223.91;
    ssl_certificate /etc/letsencrypt/live/43.161.223.91/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/43.161.223.91/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    include /etc/nginx/quant-api.conf;
}
