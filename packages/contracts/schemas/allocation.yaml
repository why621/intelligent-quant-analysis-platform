AllocationRequest:
  type: object
  additionalProperties: false
  required: [symbols, strategyId]
  properties:
    parameters: {type: object, additionalProperties: true, default: {}}
    adjust: {$ref: './common.yaml#/AdjustMode'}
    tradingCosts: {$ref: './backtest.yaml#/TradingCosts'}
    initialCapitalCny: {type: number, exclusiveMinimum: 0, default: 100000}
    startDate: {type: string, format: date}
    symbols:
      type: array
      minItems: 1
      maxItems: 10
      uniqueItems: true
      items: {$ref: "./common.yaml#/Symbol"}
    strategyId: {type: string}
    cashPct:
      type: number
      minimum: 0
      maximum: 100
      default: 0
AllocationPosition:
  type: object
  required: [symbol, weightPct, action]
  properties:
    symbol: {$ref: "./common.yaml#/Symbol"}
    weightPct:
      type: number
      minimum: 0
      maximum: 100
    action:
      type: string
      enum: [increase, hold, decrease, exit]
    reason: {type: string}
AllocationResponse:
  type: object
  required:
    [basisDate, targetDate, strategyId, positions, cashPct, advisoryOnly, disclaimer]
  properties:
    request:
      $ref: '#/AllocationRequest'
      description: 实际参数及重放起点；从全现金账户重放至basisDate，再计算目标权重，未来费用尚未发生。
    dataContext: {$ref: "./common.yaml#/ResearchContext"}
    basisDate:
      type: string
      format: date
      description: 已发布截止，必须等于上海当前日期之前最近交易日；缺失503 DATA_NOT_READY，过期503 DATA_STALE，绝不隐式补拉
    targetDate:
      type: string
      format: date
      description: 建议对应的下一交易日
    strategyId: {type: string}
    positions:
      type: array
      items: {$ref: "#/AllocationPosition"}
    cashPct:
      type: number
      minimum: 0
      maximum: 100
      description: 实际现金比例，与持仓权重合计100%；全部退出时为100%
    advisoryOnly: {type: boolean, const: true}
    disclaimer:
      type: string
      description: 必须明确不构成投资建议且不会提交真实订单
