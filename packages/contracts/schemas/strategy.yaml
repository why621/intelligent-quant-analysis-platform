Strategy:
  type: object
  required: [id, name, category, status, description, parameterSchema]
  properties:
    id:
      type: string
      pattern: "^[a-z][a-z0-9_-]{2,49}$"
      examples: [ma_cross]
    name: {type: string}
    category:
      type: string
      enum: [traditional, ai]
    status:
      type: string
      description: available策略允许回测；experimental仅在backtestEnabled为true时允许受限实验回测，不代表绩效验收通过。planned不可执行。
      enum: [available, experimental, planned]
    backtestEnabled:
      type: boolean
      description: 仅回测能力；实验策略必须显式true才开放，缺省不开放；不适用于排行或配置。
    allocationEnabled:
      type: boolean
      description: 显式开放实验组合模型的模拟重放；缺省不开放。
    modelContext: {$ref: "#/ModelContext"}
    description: {type: string}
    parameterSchema:
      type: object
      description: JSON Schema 子集；客户端显式填入default，服务端不自动补全。x-relations为数组，元素left和right引用数值属性，operator=lt表示left严格小于right；前端验证此关系，后端继续策略业务校验。
      additionalProperties: true
RankingItem:
  type: object
  required: [rank, strategyId, strategyName, category, returnPct, maxDrawdownPct, sharpe]
  properties:
    parameters: {type: object, additionalProperties: true}
    metrics: {$ref: './backtest.yaml#/BacktestMetrics'}
    costSummary: {$ref: './backtest.yaml#/CostSummary'}
    benchmarkContext: {$ref: './backtest.yaml#/BenchmarkContext'}
    rank: {type: integer, minimum: 1}
    strategyId: {type: string}
    strategyName: {type: string}
    category: {type: string, enum: [traditional, ai]}
    status:
      type: string
      enum: [available, experimental]
      description: 实验排行仍为experimental，不代表绩效验收通过；缺省兼容旧条目。
    modelContext: {$ref: "#/ModelContext"}
    returnPct:
      type: number
      description: 百分点
    maxDrawdownPct:
      type: number
      description: 非负百分点
      minimum: 0
    sharpe: {type: number}
RankingUnavailable:
  type: object
  required: [strategyId, strategyName, code, message]
  properties:
    strategyId: {type: string}
    strategyName: {type: string}
    code: {type: string}
    message: {type: string}
RankingResponse:
  type: object
  required: [asOfDate, period, items]
  properties:
    evaluationStartDate: {type: string, format: date}
    evaluationEndDate: {type: string, format: date}
    historyStartDate: {type: string, format: date}
    observationCount: {type: integer, minimum: 1}
    tradingCosts: {$ref: './backtest.yaml#/TradingCosts'}
    unavailableStrategies:
      type: array
      description: 已启用但因训练重叠、预热不足或运行错误未参与的策略；不得以零收益冒充结果。
      items: {$ref: "#/RankingUnavailable"}
    evaluationSymbols:
      type: array
      items: {$ref: "./common.yaml#/Symbol"}
      description: 实际排行研究资产，当前为510300

    dataContext: {$ref: "./common.yaml#/ResearchContext"}
    asOfDate: {type: string, format: date}
    period: {type: string, enum: [1d, 7d, 30d, 1y]}
    items:
      type: array
      items: {$ref: "#/RankingItem"}

ModelContext:
  type: object
  additionalProperties: false
  required: [modelRef, bundleHash, trainStartDate, trainEndDate, outOfSampleStartDate, symbols, adjust, warmupBars, minimumBars, trainingDataVersion, universeVersion, executionVersion]
  properties:
    modelRef: {type: string}
    bundleHash: {type: string, pattern: '^[a-f0-9]{64}$'}
    trainStartDate: {type: string, format: date}
    trainEndDate: {type: string, format: date}
    inSampleEndDate:
      type: string
      format: date
      description: 训练与验证区间的截止日；旧响应可缺省，不能仅按训练截止推断长窗口样本外边界。
    valStartDate: {type: string, format: date}
    valEndDate: {type: string, format: date}
    testStartDate:
      type: string
      format: date
      description: 模型记录的预留测试区间起点，不代表当前网页有该段行情或绩效验收通过。
    testEndDate: {type: string, format: date}
    outOfSampleStartDate:
      type: string
      format: date
      description: 样本内截止次日，属于理论日期下限；实际回测仍受已发布行情范围和预热门禁约束。验证或测试字段缺省表示模型未记录，不得编造。
    symbols:
      description: 历史兼容字段；assetScope缺省时是允许资产列表。published_universe的joint_portfolio模型返回独立证据覆盖的完整适用目录；旧equal_cash_independent模型保留训练资产。训练来源以trainingSymbols为准。
      type: array
      minItems: 1
      items: {$ref: "./common.yaml#/Symbol"}
    trainingSymbols:
      type: array
      minItems: 1
      items: {$ref: "./common.yaml#/Symbol"}
      description: 模型训练资产；不是允许回测的资产列表。
    assetScope:
      enum: [published_universe, training_symbols]
      description: published_universe允许当前发布目录中的股票或ETF，joint_portfolio为2至10只、旧equal_cash_independent为1至10只，另须通过模型证据及行情门禁；training_symbols或缺省沿用训练池限制。
    portfolioMode:
      enum: [equal_cash_independent, joint_portfolio]
      description: joint_portfolio为同时观察2–10资产、联合权重与共享账户；旧模式为独立分账。
    minAssets: {type: integer, minimum: 1, maximum: 10}
    maxAssets: {type: integer, minimum: 1, maximum: 10}
    evaluation:
      type: object
      description: 绑定权重哈希的验证与样本外评估、基线和限制；不代表已证明超额收益。
      additionalProperties: true
    supportedAssetTypes:
      type: object
      additionalProperties: {type: string, enum: [stock, etf]}
      description: 独立范围证据覆盖的目录资产类型；与当前数据目录核对。
    scopeDataVersion: {type: string, pattern: '^[a-f0-9]{64}$'}
    costPolicy: {type: string, enum: [request_configurable]}
    crossAssetValidationStatus:
      type: string
      enum: [execution_validated]
      description: 已验证跨资产执行和共享账本，不代表收益有效性或全部组合已枚举。
    crossAssetValidated:
      type: boolean
      description: 跨资产效果是否已验证；需结合crossAssetValidationStatus解释；执行验证通过不代表收益有效性已证明。
    trainingConsistency: {const: research_backfill_unpublished}
    targetUniverseVersion: {type: string, pattern: '^[a-f0-9]{64}$'}
    performanceStatus: {const: unproven}
    requiredTradingCosts: {$ref: './backtest.yaml#/TradingCosts'}
    trainingTradingCosts: {$ref: './backtest.yaml#/TradingCosts'}
    representationLearning:
      type: object
      additionalProperties: false
      required: [architecture, method, poolChanges, performanceImprovement]
      properties:
        architecture:
          type: string
          enum: [masked-set-sac-research-v1, masked-set-ppo-v1, masked-set-td3-v1]
        method: {type: string, const: earnmore_inspired_masked_features}
        poolChanges: {type: string, const: training_in_episode}
        performanceImprovement: {type: string, const: unproven}
    valFolds:
      type: array
      items:
        type: object
        required: [start, end]
        properties:
          start: {type: string, format: date}
          end: {type: string, format: date}
    adjust: {const: qfq}
    warmupBars: {type: integer, minimum: 0}
    minimumBars: {type: integer, minimum: 1}
    trainingDataVersion: {type: string, pattern: '^[a-f0-9]{64}$'}
    universeVersion: {type: string}
    executionVersion: {type: string}

ResearchRankingItem:
  allOf:
    - {$ref: '#/RankingItem'}
    - type: object
      required: [parameters, metrics, costSummary, benchmarkContext]
  description: 参数是该行实际执行参数；metrics及费用/基准摘要直接来自同配置正式回测引擎，不另行重算或截取。
ResearchRankingRequest:
  allOf:
    - {$ref: './backtest.yaml#/BacktestRequest'}
  description: 沿用回测配置，最多366天；当前strategyId采用parameters，其他候选采用目录默认参数。绝不替换资产、日期或费用。
ResearchRankingResponse:
  type: object
  required: [request, configHash, dataContext, asOfDate, evaluationSymbols, evaluationStartDate, evaluationEndDate, observationCount, tradingCosts, items, unavailableStrategies]
  properties:
    request: {$ref: './backtest.yaml#/BacktestRequest'}
    configHash:
      type: string
      pattern: '^[a-f0-9]{64}$'
      description: 完整配置、候选参数元数据、模型身份及行情版本的摘要；不可用作策略绩效证明。
    dataContext: {$ref: './common.yaml#/ResearchContext'}
    asOfDate: {type: string, format: date}
    evaluationSymbols:
      type: array
      minItems: 1
      maxItems: 10
      uniqueItems: true
      items: {$ref: './common.yaml#/Symbol'}
    evaluationStartDate: {type: string, format: date}
    evaluationEndDate: {type: string, format: date}
    observationCount: {type: integer, minimum: 2}
    tradingCosts: {$ref: './backtest.yaml#/TradingCosts'}
    items:
      type: array
      minItems: 1
      items: {$ref: '#/ResearchRankingItem'}
    unavailableStrategies:
      type: array
      items: {$ref: '#/RankingUnavailable'}
      description: 非当前候选若范围、成本、样本外或数据不适用则明确列出原因；当前策略不可用时整单报错。
