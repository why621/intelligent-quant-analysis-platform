CorrelationRequest:
  type: object
  additionalProperties: false
  required: [symbols, startDate, endDate]
  properties:
    symbols:
      type: array
      minItems: 2
      maxItems: 10
      uniqueItems: true
      items: {$ref: "./common.yaml#/Symbol"}
    startDate: {type: string, format: date}
    endDate: {type: string, format: date}
    adjust: {$ref: "./common.yaml#/AdjustMode"}
    returnType:
      type: string
      enum: [simple, log]
      default: simple
CorrelationResponse:
  type: object
  required: [symbols, observationCount, matrix]
  properties:
    returnAlignment:
      const: common_observation_intervals
      description: 按相邻共同有效收盘日计算收益，停牌可能形成多日区间；不填价。
    dataContext: {$ref: "./common.yaml#/ResearchContext"}
    symbols:
      type: array
      items: {$ref: "./common.yaml#/Symbol"}
    observationCount: {type: integer, minimum: 2}
    matrix:
      type: array
      description: 顺序与 symbols 一致的 N×N 对称矩阵
      items:
        type: array
        items:
          type: [number, "null"]
          minimum: -1
          maximum: 1
          description: 资产对无有效数据（无波动或观察日不足）时为 null
