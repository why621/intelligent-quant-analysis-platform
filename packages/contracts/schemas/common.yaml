Symbol:
  type: string
  pattern: "^[0-9]{6}$"
  examples: ["510300"]
AssetType:
  type: string
  enum: [stock, etf]
AdjustMode:
  type: string
  enum: [qfq, hfq, none]
  default: qfq
HealthResponse:
  type: object
  required: [status, service, version]
  properties:
    status: {type: string, const: ok}
    service: {type: string, const: intelligent-quant-backend}
    version: {type: string}
ErrorResponse:
  type: object
  required: [error]
  properties:
    error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          examples: [VALIDATION_ERROR]
        message: {type: string}
        details:
          type: [object, "null"]
          additionalProperties: true
          description: 日期错误包含field、startDate、endDate、availableStartDate、availableEndDate与symbols；可用区间为全局截止及日历边界，不保证每资产完整。
          properties:
            field: {type: string}
            startDate: {type: string, format: date}
            endDate: {type: string, format: date}
            availableStartDate: {type: string, format: date}
            availableEndDate: {type: [string, "null"], format: date}
            symbols:
              type: array
              items: {$ref: "#/Symbol"}
