openapi: 3.1.0
info:
  title: 智能量化分析平台 API
  version: 0.9.0
  description: |
    前端、Flask 后端与算法模块之间唯一具有约束力的 HTTP 契约。
    平台面向 A 股及场内 ETF，按交易日收盘后更新。配置建议仅用于研究，
    不连接券商、不提交真实订单。
    研究只读已有数据。published_snapshot 表示启动时载入且经校验的不可变327资产目录发布包，availability区分完整与部分可用；
    legacy_revision 仅保护旧缓存修订，不代表完整不可变批次。切换发布指针后新进程加载新包。
    研究接口可携带X-Research-Version（来自data/status的dataContext.dataVersion）；
    版本不符或计算期间发生更新返回409 DATA_VERSION_CHANGED，更新中/失败返回503 DATA_NOT_READY。
    latestTradeDate为批次目标日，逐资产真实末日和未知缺口见availability。
    研究按请求资产和区间检查，未知缺口拒绝；概览缺口不计停牌或平盘。
    配置若发布截止不等于上海当前日期之前最近交易日返回503 DATA_STALE。
servers:
  - url: /api
    description: 同域部署
tags:
  - {name: System}
  - {name: Data}
  - {name: Analytics}
  - {name: Strategy}
  - {name: Backtest}
  - {name: Allocation}
paths:
  /data/capability:
    post:
      tags: [Data]
      summary: 按模块及实际依赖预检同版数据覆盖，不采集或创建任务
      operationId: checkDataCapability
      parameters:
        - $ref: '#/components/parameters/ResearchVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './schemas/data.yaml#/ModuleCapabilityRequest'}
      responses:
        '200':
          description: ready仅表示数据覆盖；partial可展示部分概览，unavailable说明具体依赖，旧模式unknown
          content:
            application/json:
              schema: {$ref: './schemas/data.yaml#/ModuleCapability'}
        default: {$ref: '#/components/responses/Error'}
  /data/coverage:
    get:
      summary: 当前不可变发布的327资产覆盖目录（旧运行未发布时503）
      responses:
        '200':
          description: 完整目录、逐资产可用性及共享上下文
          content:
            application/json:
              schema: {$ref: './schemas/data.yaml#/PublishedCoverage'}
        '503':
          description: 尚无可读发布
        '409':
          description: 请求研究版本冲突
  /health:
    get:
      tags: [System]
      summary: 服务健康检查
      operationId: getHealth
      responses:
        "200":
          description: 服务正常
          content:
            application/json:
              schema: {$ref: "./schemas/common.yaml#/HealthResponse"}
  /data/status:
    get:
      tags: [Data]
      summary: 获取日更数据状态
      operationId: getDataStatus
      responses:
        "200":
          description: 最近一次更新情况
          content:
            application/json:
              schema: {$ref: "./schemas/data.yaml#/DataStatus"}
        default: {$ref: "#/components/responses/Error"}
  /assets:
    get:
      tags: [Data]
      summary: 查询可用资产
      operationId: listAssets
      parameters:
        - in: query
          name: query
          schema: {type: string, maxLength: 30}
          description: 按六位代码或名称模糊查询
        - in: query
          name: assetType
          schema: {$ref: "./schemas/common.yaml#/AssetType"}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - in: query
          name: offset
          schema: {type: integer, minimum: 0, maximum: 100000, default: 0}
          description: 过滤后稳定排序目录的偏移；跨页catalogVersion变化时丢弃本次目录并重试
      responses:
        "200":
          description: 资产列表
          content:
            application/json:
              schema:
                $ref: "./schemas/data.yaml#/AssetPage"
        default: {$ref: "#/components/responses/Error"}
  /assets/{symbol}/history:
    get:
      tags: [Data]
      summary: 获取复权日线
      operationId: getAssetHistory
      parameters:
        - $ref: "#/components/parameters/ResearchVersion"
        - $ref: "#/components/parameters/Symbol"
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
        - in: query
          name: adjust
          schema: {$ref: "./schemas/common.yaml#/AdjustMode"}
      responses:
        "200":
          description: 按日期升序的日线
          content:
            application/json:
              schema: {$ref: "./schemas/data.yaml#/HistoryResponse"}
        default: {$ref: "#/components/responses/Error"}
  /market/overview:
    get:
      tags: [Data]
      summary: 获取市场概况
      operationId: getMarketOverview
      parameters:
        - in: query
          name: tradeDate
          schema: {type: string, format: date}
      responses:
        "200":
          description: 市场宽度、指数与资金热度
          content:
            application/json:
              schema: {$ref: "./schemas/data.yaml#/MarketOverview"}
        default: {$ref: "#/components/responses/Error"}
  /analytics/correlation:
    post:
      tags: [Analytics]
      summary: 计算资产收益率相关性
      description: 请求区间须在2025—2026已验证日历及已发布latestTradeDate内；越界400 DATE_OUT_OF_RANGE，无发布截止503 DATA_NOT_READY；范围内源失败503 UPSTREAM_UNAVAILABLE。
      operationId: calculateCorrelation
      parameters:
        - $ref: "#/components/parameters/ResearchVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "./schemas/analytics.yaml#/CorrelationRequest"}
      responses:
        "200":
          description: 对称相关系数矩阵
          content:
            application/json:
              schema: {$ref: "./schemas/analytics.yaml#/CorrelationResponse"}
        default: {$ref: "#/components/responses/Error"}
  /strategies:
    get:
      tags: [Strategy]
      summary: 查询策略目录
      operationId: listStrategies
      responses:
        "200":
          description: 可用、试验中和规划中的策略；experimental仅backtestEnabled=true可提交实验回测，modelContext说明已部署模型范围。
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "./schemas/strategy.yaml#/Strategy"}
        default: {$ref: "#/components/responses/Error"}
  /strategies/ranking:
    get:
      tags: [Strategy]
      summary: 获取策略排行榜
      operationId: getStrategyRanking
      parameters:
        - $ref: "#/components/parameters/ResearchVersion"
        - in: query
          name: period
          schema:
            type: string
            enum: [1d, 7d, 30d, 1y]
            default: 30d
      responses:
        "200":
          description: 仅包含有真实计算结果的策略
          content:
            application/json:
              schema: {$ref: "./schemas/strategy.yaml#/RankingResponse"}
        default: {$ref: "#/components/responses/Error"}
  /backtests:
    post:
      tags: [Backtest]
      summary: 提交异步回测任务
      description: 同步校验策略参数、已接入独立指数或ETF基准和已发布日期范围后入队。experimental仅backtestEnabled=true可回测；PPO仅已部署白名单modelRef与qfq；assetScope=published_universe时支持发布资产池内1至10只资产，等分初始资金后逐资产独立运行，跨资产效果尚未验证。起始日须晚于训练截止且每只资产不少于22根行情，短数据错误details.symbol指出资产。RL_IN_SAMPLE_REQUEST、RL_INSUFFICIENT_HISTORY、RL_INCOMPATIBLE_MODEL、RL_MODEL_NOT_FOUND返回422；worker依赖缺失为RL_DEPENDENCIES_MISSING。日期错误含请求区间、可用截止及symbols；查询返回提交时request快照，PPO结果附modelContext。
      operationId: createBacktest
      parameters:
        - $ref: "#/components/parameters/ResearchVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "./schemas/backtest.yaml#/BacktestRequest"}
      responses:
        "202":
          description: 任务已受理
          content:
            application/json:
              schema: {$ref: "./schemas/backtest.yaml#/BacktestJob"}
        default: {$ref: "#/components/responses/Error"}
  /backtests/{jobId}:
    get:
      tags: [Backtest]
      summary: 查询回测任务及结果
      operationId: getBacktest
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: 任务状态；完成后 result 非空
          content:
            application/json:
              schema: {$ref: "./schemas/backtest.yaml#/BacktestJob"}
        default: {$ref: "#/components/responses/Error"}
  /allocation/suggestion:
    post:
      tags: [Allocation]
      summary: 生成下一交易日模拟配置建议
      operationId: createAllocationSuggestion
      parameters:
        - $ref: "#/components/parameters/ResearchVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "./schemas/allocation.yaml#/AllocationRequest"}
      responses:
        "200":
          description: 基于上一交易日收盘数据的研究建议
          content:
            application/json:
              schema: {$ref: "./schemas/allocation.yaml#/AllocationResponse"}
        default: {$ref: "#/components/responses/Error"}
components:
  parameters:
    ResearchVersion:
      in: header
      name: X-Research-Version
      required: false
      schema: {type: string, pattern: '^[a-f0-9]{64}$'}
      description: 页面读取的dataContext.dataVersion；不匹配拒绝研究，避免跨模块静默混版。
    Symbol:
      in: path
      name: symbol
      required: true
      schema: {$ref: "./schemas/common.yaml#/Symbol"}
    JobId:
      in: path
      name: jobId
      required: true
      schema: {type: string, format: uuid}
    StartDate:
      in: query
      name: startDate
      required: true
      schema: {type: string, format: date}
    EndDate:
      in: query
      name: endDate
      required: true
      schema: {type: string, format: date}
  responses:
    Error:
      description: 请求失败
      content:
        application/json:
          schema: {$ref: "./schemas/common.yaml#/ErrorResponse"}
