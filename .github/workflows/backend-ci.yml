name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - services/backend/**
      - packages/contracts/**
      - docs/api-contract.md
      - .github/workflows/backend-ci.yml
  pull_request:
    paths:
      - services/backend/**
      - packages/contracts/**
      - docs/api-contract.md
      - .github/workflows/backend-ci.yml

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend and contract tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/backend/pyproject.toml
      - name: Install backend dependencies
        run: |
          python -m pip install -e "services/algorithms[dev]"
          python -m pip install -e "services/backend[dev]"
      - name: Lint backend
        run: ruff check services/backend
      - name: Test backend and OpenAPI references
        run: pytest services/backend
