name: Regression stack CI

on:
  push:
    branches: [main, codex/regression-deployment]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-stack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build stack
        run: docker compose -f compose.regression.yml build
      - name: Start stack
        run: docker compose -f compose.regression.yml up -d --wait
      - name: Run smoke test
        run: python3 tools/smoke_regression.py
      - name: Show container logs on failure
        if: failure()
        run: docker compose -f compose.regression.yml logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose -f compose.regression.yml down --volumes
