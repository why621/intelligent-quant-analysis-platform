name: Algorithms CI

on:
  push:
    branches: [main]
    paths:
      - services/algorithms/**
      - .github/workflows/algorithms-ci.yml
  pull_request:
    paths:
      - services/algorithms/**
      - .github/workflows/algorithms-ci.yml

permissions:
  contents: read

jobs:
  algorithm-tests:
    name: Algorithm tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/algorithms/pyproject.toml
      - name: Install algorithm dependencies
        run: python -m pip install -e "services/algorithms[dev]"
      - name: Lint algorithms
        run: ruff check services/algorithms
      - name: Test algorithms
        run: pytest services/algorithms
